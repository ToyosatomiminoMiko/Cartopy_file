# 标签编辑器配置: 直接运行 `python tools/label_editor.py`, 不带任何参数.
# 监听地址固定 127.0.0.1(只有本机能访问), 所以没有地址项.

# 要微调标签的地图 SVG; 相对路径以仓库根目录为准.
# 换一张图就改这一行, 编辑器保存后重跑出图脚本即可固化布局.
svg = "Volga/volga_basin_topography_etopo2022_lambert_conformal.svg"

# 监听端口: 0 = 由系统分配空闲端口(推荐; 固定端口可能被其它进程占用).
port = 0

# 启动后是否自动打开浏览器.
open_browser = true
